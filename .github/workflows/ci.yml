name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint the backend and run unit and integration tests.
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install sqlalchemy==2.0.35
          pip install httpx==0.27.2
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        run: ruff check backend/app --output-format=github
        continue-on-error: true

      - name: Type-check backend
        run: mypy backend/app --ignore-missing-imports
        continue-on-error: true

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/unit backend/tests/integration -v --cov=backend/app

  # Report security findings without blocking the normal CI pipeline.
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit
        run: bandit -r backend/app
        continue-on-error: true

      - name: Check dependency vulnerabilities
        run: safety check -r backend/requirements.txt || true

  # Build both container images after linting and tests pass; do not publish them.
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build backend/ -t projectscope-backend:ci

      - name: Build frontend image
        run: docker build frontend/ -t projectscope-frontend:ci
